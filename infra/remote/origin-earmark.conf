## Hetzner origin: included inside the 443 server block of /etc/nginx/sites-enabled/summerfest
## (the one only linode can reach). Installed as /etc/nginx/snippets/earmark-origin.conf.
location ^~ /earmark {
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    ## "Read a file" uploads whole tracks (a 10 min WAV is ~100 MB).
    client_max_body_size 150m;
    proxy_request_buffering on;
    proxy_read_timeout 5m;
}
