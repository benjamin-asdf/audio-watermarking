[package]
name = "wmark"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Embed/detect Earmark watermarks: own engine, pure Rust audio I/O, JSON on stdout"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
realfft = "3.5"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
flacenc = "0.5"
rusty-chromaprint = "0.3"
