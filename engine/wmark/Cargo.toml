[package]
name = "wmark"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Embed/detect artist watermarks: wraps audiowmark, ffmpeg and fpcalc, JSON on stdout"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
realfft = "3.5"
hound = "3.5"
